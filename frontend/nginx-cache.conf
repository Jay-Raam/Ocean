# Nginx cache + compression reference for the built site (dist/).
#
# Drop the contents into your server {} block (root points at dist/).
# Serving precompressed .br/.gz files requires:
#   - ngx_http_gzip_static_module  (built with `--with-http_gzip_static_module`)
#   - ngx_brotli                   (https://github.com/google/ngx_brotli) for brotli
# The dist/ build already contains `.br`/`.gz` siblings for every text asset
# (see scripts/compress-dist.mjs), so nginx serves them with zero CPU cost.
#
# NOTE: `add_header` inherits only if no inner add_header exists; these rules
# are written so each location sets its own Cache-Control.

root /var/www/ocean/dist;
index index.html;

# Serve precompressed variants when the client supports them.
gzip_static on;
brotli_static on;

# SPA fallback: let the router handle client-side routes.
location / {
    try_files $uri /index.html;
}

# index.html revalidates every visit so new deploys are picked up.
location = /index.html {
    add_header Cache-Control "no-cache";
}

# Content-hashed JS/CSS — safe to cache forever.
location ~* ^/assets/.*\.(js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Static media/fonts/videos — long cache with background revalidation.
location ~* ^/assets/.*\.(webp|avif|jpe?g|png|gif|svg|ico|mp4|webm|woff2?|ttf|otf|eot)$ {
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
}
